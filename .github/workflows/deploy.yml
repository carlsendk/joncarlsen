name: Deploy CV site to GitHub Pages

# Push to the default branch builds, gates, and PUBLISHES.
# workflow_dispatch runs the build + quality gate only (no publish) — a safe
# way to smoke-test the pipeline without putting content live.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Least-privilege token; the Pages deploy needs pages:write + id-token:write.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let the most recent push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: CSS size budget (<= 20 KB raw)
        run: |
          CSS="$(find dist -name '*.css' | head -1)"
          RAW="$(wc -c < "$CSS")"
          echo "Purged CSS: $CSS = ${RAW} bytes (budget 20480)"
          test "$RAW" -le 20480

      - name: Lighthouse budgets (performance >= 90, accessibility >= 95)
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Link check (internal/asset/PDF + GitHub strict; LinkedIn + self-origin accepted)
        run: |
          npx --yes linkinator@6.1.2 ./dist --recurse \
            --skip '(^https?://(www\.)?linkedin\.com|^https?://(www\.)?joncarlsen\.dk)'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Publish ONLY on a real push to the default branch. A manual
    # workflow_dispatch run stops after the gate above and never publishes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
